plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
}

def minecraftVer = sc.current.version
def modTarget = property("mod.target")
def voxyTarget = property("voxy.target")
def version = "${property("mod.version")}+${minecraftVer}"

base.archivesName = "${property("mod.name")}-${version}"

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name "CaffeineMC"
        url "https://maven.caffeinemc.net/releases" // or /snapshots
    }
	maven {
		url "https://maven.shedaniel.me/"
	}
	maven {
		url "https://maven.terraformersmc.com/releases/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVer}"

	implementation "net.fabricmc:fabric-loader:${property('deps.fabric_loader')}"

	implementation "net.fabricmc.fabric-api:fabric-api:${property('deps.fabric_api')}"

	implementation "maven.modrinth:voxy:${property('deps.voxy')}"

	implementation "maven.modrinth:flashback:${property('deps.flashback')}"

	implementation "maven.modrinth:sodium:${property('deps.sodium')}"

	implementation "net.caffeinemc:sodium-fabric-api:${property('deps.sodium_api')}"

	implementation "maven.modrinth:modmenu:${property('deps.mod_menu')}"

	api("me.shedaniel.cloth:cloth-config-fabric:${property('deps.cloth_config')}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	implementation "maven.modrinth:replaymod:${property('deps.replay_mod')}"
}

processResources {
	inputs.property "mod_version", version
	inputs.property "mod_target", modTarget
	inputs.property "voxy_target", voxyTarget

	def expandProperties = [
			"mod_version": version,
			"mod_target": modTarget,
			"voxy_target": voxyTarget
	]

	filesMatching("fabric.mod.json") {
		expand(expandProperties)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

loom {
	accessWidenerPath = rootProject.file("src/main/resources/voxy-extra.accesswidener")
}

// configure the maven publication
publishing {
	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def collectJars = tasks.register("collectJars", Copy) {copy ->

	def task = tasks.named("jar")

	dependsOn(task)

	copy.from task
	copy.into rootProject.buildDir.path + "/libs"
}

assemble {
	dependsOn(collectJars)
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "voxy-extra"
	changelog = rootProject.file("CHANGELOG.md").text
	versionNumber = version
	versionName = version
	versionType = property("mod.versionType")
	property("mod.gameVersions").split(", ").each {
		gameVersions.add it
	}
	loaders = ["fabric"]
	environment = "client_only"
	uploadFile = jar
	dependencies {
		required.project "cloth-config"
		required.project "voxy"
		required.project "fabric-api"
	}
}
